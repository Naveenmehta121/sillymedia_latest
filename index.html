        "name": "What does social media management cost at Sillymedia?",

          "@type": "Answer",
          "text": "Sillymedia offers three monthly packages: Starter at ₹15,999/month (8–9 creatives including reels and posts), Growth at ₹34,999/month (12 creatives with strategy and analytics), and Premium at ₹49,999/month (16–20 creatives with full brand management and Google Business Profile). Custom enterprise quotes are also available."
        }
      },
      {
        "@type": "Question",
        "name": "Does Sillymedia do influencer marketing?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Sillymedia runs a dedicated influencer marketing division for restaurant and hospitality brands in Delhi NCR. We manage influencer outreach, campaign negotiation, and performance tracking. We also operate a commission-based influencer model where influencers are compensated based on measured outcomes rather than flat fees."
        }
      },
      {
        "@type": "Question",
        "name": "What is Sillymedia's commission-based influencer model?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Unlike traditional flat-fee influencer arrangements, Sillymedia's commission-based model ties influencer compensation to actual measurable results — such as footfall, reservations, or tracked orders. This reduces upfront risk for restaurant and café clients and aligns incentives between the brand, agency, and influencer."
        }
      },
      {
        "@type": "Question",
        "name": "How soon can I see results from social media management?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Initial improvements in engagement typically appear within 2–3 weeks. Meaningful follower growth and business impact (footfall, reservations, online orders) usually become visible within 4–6 weeks. Our case studies show that Bakoo Yaar achieved +180% engagement in 4 months and The Spot achieved +400% engagement in just 2 months."
        }
      },
      {
        "@type": "Question",
        "name": "What makes Sillymedia different from other social media agencies in Delhi NCR?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sillymedia focuses specifically on the restaurant and hospitality sector, giving us deep understanding of F&B audience behaviour, food photography standards, and dining occasion marketing. We combine daily content delivery with a dedicated influencer division and commission-based performance models — something most generalist agencies in Delhi NCR do not offer."
        }
      },
      {
        "@type": "Question",
        "name": "Do you provide analytics and reporting?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. All plans include monthly analytics reports covering growth metrics, engagement rates, reach, and ROI. Premium plan clients receive additional monthly performance insights, competitor benchmarking, and Google Business Profile reports."
        }
